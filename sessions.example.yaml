sessions:
  - name: "auth-refactor"
    project_path: "/path/to/your/project"
    goal: "Refactor the authentication module to use JWT tokens. Add unit tests."
    model: "claude-opus-4-6"         # optional, defaults to claude-opus-4-6
    thinking: false                  # enable extended thinking (recommended for complex tasks)
    thinking_budget: 10000           # legacy models only (Haiku 4.5, Sonnet 4.5, Opus 4.5 and older);
                                     # newer models use adaptive thinking + `effort` instead
    effort: ""                       # low | medium | high | max — thinking depth and spend control.
                                     # Ignored on legacy models, which reject the parameter.
    max_output_tokens: 8192          # max_tokens per API call (default 8192)
    max_cost_usd: 0                  # stop once estimated spend reaches this many USD (0 = no limit).
                                     # Pairs with max_turns: 0 to bound an otherwise uncapped run.
    disable_prompt_cache: false      # prompt caching is ON by default; it makes repeated turns
                                     # dramatically cheaper. Set true only to opt out.
    tool_permissions:
      auto_approve_reads: true        # read_file, list_directory, grep auto-approved
      auto_approve_bash: false        # bash commands always require approval
      auto_approve_writes: false      # write_file, edit_file always require approval
      auto_approve_web_fetch: false   # web fetch requests always require approval
      auto_approve_http: false        # http tool always requires approval
      auto_approve_file_ops: false    # create_directory, move_file, delete_file always require approval
      auto_approve_web_search: false  # web_search always requires approval
      auto_approve_git_reads: false   # git status/log/diff/branch always requires approval
      auto_approve_git_writes: false  # git add/commit/checkout/… always requires approval
      auto_approve_run_tests: false   # run_tests always requires approval
    max_turns: 50                     # safety cap (default: 50 when omitted). Set to 0 for unlimited turns
    context_window: 0                 # sliding-window compression: keep first + last N messages (0 = off)
    # depends_on: []                  # session names that must complete before this one starts (pipeline mode)
    # github:
    #   create_pr: false              # on completion, push the branch and run gh pr create
    #   base_branch: main             # PR target branch (default: main)
    #   remote: origin                # git remote to push the branch to (default: origin)
    #   title_prefix: "feat: "        # prepended to auto-generated PR title
    #   draft: false                  # open as draft PR

  # Session group example: run the same goal across multiple projects.
  # Each project_path becomes its own session named "<name>-1", "<name>-2", etc.
  # - name: "add-linting"
  #   project_paths:
  #     - "/path/to/project-a"
  #     - "/path/to/project-b"
  #     - "/path/to/project-c"
  #   goal: "Add ESLint with the airbnb config and fix all warnings."
  #   model: "claude-sonnet-4-6"
  #   tool_permissions:
  #     auto_approve_reads: true
  #     auto_approve_writes: true

  - name: "docs-generator"
    project_path: "/path/to/another/project"
    goal: "Generate API documentation for all public Go functions."
    model: "claude-opus-4-6"
    thinking: true                   # use extended thinking for deeper analysis
    thinking_budget: 8000
    tool_permissions:
      auto_approve_reads: true
      auto_approve_bash: false
      auto_approve_writes: true       # allow writes without prompting for this session
      auto_approve_web_fetch: false
      auto_approve_http: false
      auto_approve_file_ops: false
    max_turns: 30

  # Batch sessions: submitted together to the Anthropic Message Batches API.
  # Cost is 50% less than standard API. Trade-offs: single-turn only (no tool
  # loop), results can take up to 24 hours, no interactive permission prompts.
  # All sessions with batch: true are grouped into one batch request.
  - name: "summarise-readme"
    project_path: "/path/to/project"
    goal: "Summarise the README in one paragraph and write it to SUMMARY.md"
    model: "claude-opus-4-6"
    batch: true                      # submit via Anthropic Message Batches API
    tool_permissions:
      auto_approve_reads: true
      auto_approve_writes: true

  - name: "changelog-draft"
    project_path: "/path/to/project"
    goal: "Draft a CHANGELOG entry for the last 10 git commits."
    model: "claude-opus-4-6"
    batch: true
    tool_permissions:
      auto_approve_reads: true
      auto_approve_bash: true
